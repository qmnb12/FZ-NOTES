name: Android build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Decode signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "${SIGNING_KEY_BASE64:-}" ]; then
            echo "::error::Missing SIGNING_KEY_BASE64. Add the app signing keystore as a Base64 GitHub Actions repository secret before building an installable APK."
            exit 1
          fi
          if [ -z "${SIGNING_KEY_ALIAS:-}" ] || [ -z "${SIGNING_STORE_PASSWORD:-}" ] || [ -z "${SIGNING_KEY_PASSWORD:-}" ]; then
            echo "::error::Missing SIGNING_KEY_ALIAS / SIGNING_STORE_PASSWORD / SIGNING_KEY_PASSWORD secrets."
            exit 1
          fi

          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.jks"
          keytool -list -keystore "$RUNNER_TEMP/signing.jks" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" >/dev/null

          SHA1="$(keytool -list -v -keystore "$RUNNER_TEMP/signing.jks" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" 2>/dev/null | awk -F': ' '/SHA1:/{print $2; exit}')"
          SHA256="$(keytool -list -v -keystore "$RUNNER_TEMP/signing.jks" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" 2>/dev/null | awk -F': ' '/SHA256:/{print $2; exit}')"
          {
            echo "### APK signing certificate"
            echo "- Android package: com.fz.notes.chat"
            echo "- Alias: $SIGNING_KEY_ALIAS"
            echo "- SHA-1: $SHA1"
            echo "- SHA-256: $SHA256"
            echo "- Installed apps signed with a different certificate must be uninstalled first; Google OAuth (Drive backup) needs this SHA-1 in the Android OAuth client."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install Gradle 9.6.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.6.1-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
      - name: Build signed APK
        env:
          SIGNING_KEY_PATH: ${{ runner.temp }}/signing.jks
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: $RUNNER_TEMP/gradle-9.6.1/bin/gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: fz-notes-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
