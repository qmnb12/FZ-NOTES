name: Android debug build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Use persistent Android debug keystore (optional)
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "${ANDROID_DEBUG_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
            echo "Using the persistent Android debug keystore supplied through Actions secrets." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Google OAuth signing key"
              echo "No ANDROID_DEBUG_KEYSTORE_BASE64 secret is configured. The build uses the runner's debug key, whose SHA-1 may differ on future runs and may not match the Android OAuth client."
              echo "For stable Google sign-in, add the debug.keystore already registered in Google Cloud as the repository secret ANDROID_DEBUG_KEYSTORE_BASE64 (base64-encoded; standard debug alias/password: androiddebugkey / android)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install Gradle 9.6.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.6.1-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
      - name: Build debug APK
        run: $RUNNER_TEMP/gradle-9.6.1/bin/gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Report Google OAuth SHA-1
        if: always()
        run: |
          KEYSTORE="$HOME/.android/debug.keystore"
          if [ -f "$KEYSTORE" ]; then
            SHA1="$(keytool -list -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey 2>/dev/null | awk -F': ' '/SHA1:/{print $2; exit}')"
            if [ -n "$SHA1" ]; then
              {
                echo "### Google OAuth Android signing fingerprint"
                echo "- Android package: `com.fz.notes.chat`"
                echo "- SHA-1: `$SHA1`"
                echo "- This is the signing certificate used by this build; register it in the Android OAuth client if Google returns DEVELOPER_ERROR (10)."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Could not read the debug certificate SHA-1." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "No debug.keystore was created; signing SHA-1 is unavailable." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fz-notes-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
