plugins {
    id 'com.android.application'
}

android {
    namespace 'com.notes.chat'
    compileSdk 34

    defaultConfig {
        applicationId "com.fz.notes.chat"
        minSdk 29
        targetSdk 34
        versionCode 3
        versionName "1.0.2"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
