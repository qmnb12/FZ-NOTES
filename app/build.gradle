plugins {
    id 'com.android.application'
}

android {
    namespace 'com.notes.chat'
    compileSdk 35

    defaultConfig {
        applicationId "com.fz.notes.chat"
        minSdk 29
        targetSdk 34
        versionCode 143
        versionName "1.5.2"
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "com.fz.notes.chat-${variant.versionName}.apk"
        }
    }

    signingConfigs {
        ci {
            if (System.getenv("SIGNING_KEY_PATH")) {
                storeFile file(System.getenv("SIGNING_KEY_PATH"))
                storePassword System.getenv("SIGNING_STORE_PASSWORD") ?: ""
                keyAlias System.getenv("SIGNING_KEY_ALIAS") ?: ""
                keyPassword System.getenv("SIGNING_KEY_PASSWORD") ?: ""
            }
        }
    }

    buildTypes {
        debug {
            if (System.getenv("SIGNING_KEY_PATH")) signingConfig signingConfigs.ci
        }
        release {
            minifyEnabled false
            if (System.getenv("SIGNING_KEY_PATH")) signingConfig signingConfigs.ci
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.gms:play-services-auth:22.0.0'
    implementation 'androidx.work:work-runtime:2.12.0'
}
