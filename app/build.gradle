plugins {
    id 'com.android.application'
}

android {
    namespace 'com.notes.chat'
    compileSdk 34

    defaultConfig {
        applicationId "com.fz.notes.chat"
        minSdk 29
        targetSdk 34
        versionCode 16
        versionName "1.1.5"
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "com.fz.notes.chat-${variant.versionName}.apk"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
