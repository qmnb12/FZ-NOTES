plugins {
    id 'com.android.application'
}

android {
    namespace 'com.notes.chat'
    compileSdk 35

    defaultConfig {
        applicationId "com.fz.notes.chat"
        minSdk 29
        targetSdk 34
        versionCode 57
        versionName "1.4.16"
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "com.fz.notes.chat-${variant.versionName}.apk"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-auth:22.0.0'
    implementation 'androidx.work:work-runtime:2.12.0'
}
